# WildSpeech V3 — DRAFT review proposals (NOT approvals).
#
# Assembled on 2026-11-21 from the evidence in configs/v3_asr_models.yaml (official HF API + model cards, the
# competition problem description / rules / about pages, license pages). `prepared_by` is NOT a reviewer: no entry
# here approves anything, and the eligibility checker never reads this file as an approval.
#
# To approve, a named human reviewer reads the cited sources at the pinned revision and runs, e.g.:
#   python -m wildspeech.asr.reviews proposals
#   python -m wildspeech.asr.reviews accept-proposal --id P-WSP-LP P-WSP-OV --reviewer "<your full name>"
# Proposals with `ready: false` carry open questions that only you can decide; they are refused unless you add
# --resolved-open-questions (and, for overlap, usually --mitigation "<your words>").
# The accepted entry is validated exactly like a hand-written review (asr.reviews.validate_entry).

