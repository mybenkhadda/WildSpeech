# WildSpeech V3 — evidence-backed local speech-model registry (P24), schema 3.
#
# FACTS ONLY. This file records what the official sources say about each model: card URL, pinned commit,
# exact file manifest (size + LFS sha256), license, training data, architecture, and the restrictions that
# are still open. It contains NO approval switches. Approvals live only in configs/v3_asr_reviews.yaml and are
# written by a human with `python -m wildspeech.asr.reviews record|accept-proposal ...`.
# configs/v3_asr_review_proposals.yaml holds DRAFT review records assembled from the evidence below; a
# proposal never approves anything until a named reviewer accepts it.
#
# Evidence retrieved 2026-11-21 from the Hugging Face API (https://huggingface.co/api/models/<id>?blobs=true),
# the model cards / READMEs, the competition pages and the license pages listed per model. Revisions are the
# `main` commit at retrieval time. Every value marked `verbatim` was copied from the source.
#
# Eligibility is computed in 13 independent dimensions (wildspeech.asr.eligibility):
#   registry_validity · license_documentation · license_approval · training_provenance · overlap_assessment ·
#   competition_permission · checkpoint_availability · checkpoint_files · architecture_compatibility ·
#   processor_compatibility · framework_dependencies · gpu_readiness · inference_readiness
# and summarised as one lifecycle status:
#   LEGAL_REVIEW_PENDING | PROVENANCE_REVIEW_PENDING | READY_FOR_DOWNLOAD | DOWNLOADING | CHECKPOINT_INCOMPLETE |
#   FRAMEWORK_INCOMPATIBLE | READY_FOR_INFERENCE | INFERENCE_RUNNING | INFERENCE_COMPLETE | INELIGIBLE | FAILED

schema_version: 3

# Checkpoints are installed to <repo>/<checkpoint_root>/<local_dir> (git-ignored), unless a complete snapshot at the
# pinned revision already exists in the Hugging Face cache, which is then used in place (never duplicated).
checkpoint_root: models

license_policy:
  rule: >-
    Competition rule (verbatim, problem description): "External data and pretrained models, including pretrained
    speech models such as wav2vec2, Whisper, and the Pasketti children's speech models, are allowed if they are
    freely and publicly available to all participants under a permissive open license that does not prohibit
    commercial use, such as CC0 or CC-BY."
  source_url: https://platform.k12-ai-infrastructure.org/competitions/4/literacy-speech-modeling/page/10/
  # permissive: a license approval needs only the standard evidence
  permissive: [apache-2.0, mit, bsd-2-clause, bsd-3-clause, cc0-1.0, cc-by-4.0]
  # conditional: allowed only if the reviewer explicitly acknowledges every condition id (--acknowledge ...)
  conditional:
    bigcode-openrail-m:
      class: openrail_use_restricted
      license_url: https://www.bigcode-project.org/docs/pages/bigcode-openrail/
      conditions:
        - id: OPENRAIL-USE-RESTRICTIONS
          text: >-
            Attachment A use-based restrictions apply to the model and every derivative (e.g. no use that violates
            applicable law, no deceptive impersonation, no automated decisions adversely affecting legal rights).
            Commercial use and redistribution are permitted subject to these restrictions.
        - id: OPENRAIL-NOT-OSI
          text: >-
            BigCode states (verbatim) "This is not an open source license according to the Open Source Initiative
            definition". The competition requires a "permissive open license that does not prohibit commercial use"
            and separately names the Pasketti models as allowed examples. The reviewer must judge that the
            organisers' explicit naming covers this license (or obtain a forum / email ruling and cite it).
        - id: PASKETTI-OUT-OF-SCOPE
          text: >-
            The Pasketti cards list as out of scope "Fully automated high-stakes decisions, such as diagnosis or
            educational placement, without review by a qualified educator or clinician" and surveillance /
            profiling of children. Competition research use (aggregate reading-score modelling, no placement
            decisions) must stay within the stated intended use.
    cc-by-sa-3.0:
      class: share_alike
      license_url: https://creativecommons.org/licenses/by-sa/3.0/
      conditions:
        - id: CC-BY-SA-SHAREALIKE
          text: >-
            Attribution + ShareAlike: adaptations of the licensed material must carry the same license. Commercial
            use is permitted. The reviewer must judge whether ShareAlike is compatible with the competition's
            "permissive open license" requirement and the MIT release of winning solutions.
        - id: WAVLM-LICENSE-AMBIGUOUS
          text: >-
            The microsoft/wavlm-base-plus card has NO license metadata; its README links the UniSpeech repository
            LICENSE (CC BY-SA 3.0), while the WavLM code in microsoft/unilm is MIT. No statement covers the
            checkpoint weights specifically. Record which document governs the weights.
  prohibited: [cc-by-nc-4.0, cc-by-nc-sa-4.0, cc-by-nc-nd-4.0, cc-by-nc-3.0, cc-by-nc-sa-3.0, cc-by-nd-4.0,
               openrail-nc, other-research-only, llama2, gpl-3.0-only-weights]

# Back-compat list (schema-2 callers): permissive + conditional.
allowed_licenses: [apache-2.0, mit, bsd-2-clause, bsd-3-clause, cc0-1.0, cc-by-4.0, bigcode-openrail-m, cc-by-sa-3.0]

competition_policy:
  competition: "Where the Wild Features Are (Literacy Speech Modeling), K-12 AI Infrastructure platform, hosted by DrivenData"
  statement: >-
    "External data and pretrained models, including pretrained speech models such as wav2vec2, Whisper, and the
    Pasketti children's speech models, are allowed if they are freely and publicly available to all participants
    under a permissive open license that does not prohibit commercial use, such as CC0 or CC-BY."
  recorded_by: "official competition pages, retrieved 2026-11-21"
  source_url: https://platform.k12-ai-infrastructure.org/competitions/4/literacy-speech-modeling/page/10/
  rules_url: https://platform.k12-ai-infrastructure.org/competitions/4/literacy-speech-modeling/rules/
  retrieved: "2026-11-21"
  # families the organisers NAME as allowed examples (still conditional on the license)
  named_families: [whisper, wav2vec2, pasketti]
  # families allowed only through the general open-external-data rule (license must be permissive and approved)
  general_rule_families: [hubert, wavlm]
  permitted_families: [whisper, wav2vec2, pasketti, hubert, wavlm]
  data_source: >-
    Rules/about pages: "The data come from the Reach Every Reader literacy screener, collected by MIT and Florida
    State University." Public clips were denoised with FRCRN and voice-converted with FreeVC24 (about page). The
    challenge "builds on Goodnight Moon, Hello Early Literacy Screening ... with the same research team".
  conditions:
    - "You may not upload competition data to any third-party services or APIs that retain the data (rules); all inference here is local."
    - "Test data may not be used to train models, including through pseudo-labeling (rules)."
    - "school_id: your model cannot use school as an input at prediction time (problem description)."
    - "Software required by a winning solution must be under an open source license that does not prohibit free commercial use."
    - "Permission is per checkpoint: each model still needs its own license, provenance and overlap review."

models:
  # ============================================================================ child phonetic (priority 1)
  pasketti_phonetic:
    family: pasketti
    priority: 1
    role: child_phonetic
    adapter: pasketti_phonetic
    output: phones
    child_speech: true
    hf_id: drivendata/pasketti-phonetic
    hf_id_status: verified_public          # repo exists, public, not gated (HF API 2026-11-21)
    revision: 675dfe392a2af7050f1374eeab4458cb1f003b3e
    revision_date: "2026-10-23T23:45:14Z"
    local_dir: pasketti_phonetic
    expected_architectures: [hf_ctc]
    expected_model_type: wavlm
    expected_class: WavLMForCTC
    expected_params_millions: 315
    precision: fp32                        # card: load in fp32; WavLM relative position bias can NaN in fp16/bf16
    sample_rate: 16000
    max_clip_seconds: 30                   # card: trained on clips of at most 30 s (longer audio is chunked)
    phone_inventory: ipa_characters        # 55-character IPA alphabet, one CTC token per character
    files:
      - {name: config.json, size: 2396, role: config}
      - {name: preprocessor_config.json, size: 256, role: processor}
      - {name: vocab.json, size: 634, role: tokenizer}
      - {name: tokenizer_config.json, size: 794, role: tokenizer}
      - {name: special_tokens_map.json, size: 53, role: tokenizer}
      - {name: added_tokens.json, size: 18, role: tokenizer}
      - {name: model.safetensors, size: 1262097724, role: weights,
         sha256: 5b3eb5a1b7e03e25dc816ae891f18eeffa239d715a5868010b07973a077b5134}
    evidence:
      evidence_status: assembled_from_official_sources
      model_card_url: https://huggingface.co/drivendata/pasketti-phonetic
      api_url: https://huggingface.co/api/models/drivendata/pasketti-phonetic
      collection_url: https://huggingface.co/collections/drivendata/pasketti
      announcement_url: https://blog.drivendata.org/blog/on-top-of-pasketti-winners
      license_id: bigcode-openrail-m
      license_url: https://www.bigcode-project.org/docs/pages/bigcode-openrail/
      license_evidence: "cardData.license = bigcode-openrail-m; tag license:bigcode-openrail-m (HF API at 675dfe3)."
      training_sources:
        - "116 h of phonetically transcribed child speech, ~1,700 children (card)"
        - "Phonetic training corpora (card): Arizona Child Acoustic Database Repository, Cameron, Edmonton Narrative Norms Instrument, Ellis Weismer Corpus, PERCEPT-GFTA, PERCEPT-R, ReadNet, SPROUT"
        - "371 h of orthographically transcribed child speech for a secondary word head (not used at inference)"
        - "Base model microsoft/wavlm-large (Libri-Light, GigaSpeech, VoxPopuli pretraining)"
        - "Final release 'retrained on broader data, including sensitive data representing realistic education populations' (winners blog)"
      training_evidence_url: https://huggingface.co/drivendata/pasketti-phonetic
      enumerated_corpora: true
      architecture_evidence: "config.architectures = [WavLMForCTC], model_type = wavlm; card: 'a standard transformers WavLMForCTC'; no auto_map (no remote code)."
      output_format: "IPA characters (CTC); greedy decoding as evaluated on the card; mapped to ARPAbet for features, raw IPA kept"
      reported_metrics: "PER 33% overall on 44 h / 737 held-out children (card)"
      notes: "Card pins transformers==4.57.6 (matches MITSUI). torch 2.6 on the card; safetensors weights load on torch 2.5.1."
    restrictions:
      - id: PSK-PH-LICENSE
        check: license
        blocking: true
        text: >-
          bigcode-openrail-m is a conditional license (use restrictions, not OSI). Approve only with every condition
          of license_policy.conditional.bigcode-openrail-m acknowledged.
      - id: PSK-PH-READNET-OVERLAP
        check: overlap
        blocking: true
        text: >-
          The card names "ReadNet" among the phonetic training corpora. This competition's audio comes from the Reach
          Every Reader literacy screener (MIT/FSU), and the On Top of Pasketti Phonetic Track rules listed the
          "Reach Every Reader (RER) ReadNet Dataset" as prohibited external data, i.e. ReadNet is RER data. Raw,
          non-anonymised recordings of the same children and items may therefore be in the training set. This is NOT
          resolvable by "no known overlap". The reviewer must either reject, or approve with basis
          acknowledged_overlap_permitted (the organisers name Pasketti explicitly) and record the mitigation (report
          Pasketti-derived results separately; never treat its accuracy on this data as out-of-sample).

