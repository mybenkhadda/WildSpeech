name: WildSpeech M8.5 M0+ scientific tests

on:
  push:
    branches: [main]
    paths:
      - 'WildSpeech_M8/src/wildspeech_m85/**'
      - 'WildSpeech_M8/notebooks/WILDSPEECH_M85_M0PLUS_MASTER.ipynb'
      - 'WildSpeech_M8/tests/test_m85_*.py'
      - 'WildSpeech_M8/pyproject.toml'
      - '.github/workflows/wildspeech-m85.yml'
  pull_request:
    paths:
      - 'WildSpeech_M8/src/wildspeech_m85/**'
      - 'WildSpeech_M8/notebooks/WILDSPEECH_M85_M0PLUS_MASTER.ipynb'
      - 'WildSpeech_M8/tests/test_m85_*.py'
  workflow_dispatch:

jobs:
  m0plus-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install WildSpeech local package
        run: python -m pip install -e './WildSpeech_M8[test]'
      - name: Test fold-safe feature blocks, nested models and notebook
        run: python -m pytest -q -v WildSpeech_M8/tests/test_m85_*.py
      - name: Ensure previous M8.4 evaluation contract still passes
        run: python -m pytest -q WildSpeech_M8/tests/test_m84_*.py
