name: WildSpeech M8.6 item intelligence CI

on:
  push:
    branches: [main]
    paths:
      - 'WildSpeech_M8/src/wildspeech_m86/**'
      - 'WildSpeech_M8/tests/test_m86_*.py'
      - 'WildSpeech_M8/notebooks/WILDSPEECH_M86_M0PP_MASTER.ipynb'
      - 'WildSpeech_M8/pyproject.toml'
      - '.github/workflows/wildspeech-m86.yml'
  pull_request:
    paths:
      - 'WildSpeech_M8/src/wildspeech_m86/**'
      - 'WildSpeech_M8/tests/test_m86_*.py'
      - 'WildSpeech_M8/notebooks/WILDSPEECH_M86_M0PP_MASTER.ipynb'
  workflow_dispatch:
jobs:
  synthetic-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e './WildSpeech_M8[test]'
      - name: Test M8.6 nested item and screening features
        run: python -m pytest -v -q WildSpeech_M8/tests/test_m86_*.py
      - name: Preserve M8.4/M8.5 reference evaluation tests
        run: python -m pytest -q WildSpeech_M8/tests/test_m84_*.py WildSpeech_M8/tests/test_m85_*.py
