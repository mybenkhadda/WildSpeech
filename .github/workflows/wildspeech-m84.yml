name: WildSpeech M8.4 Phase 0 tests

on:
  push:
    branches: [main]
    paths:
      - 'WildSpeech_M8/src/wildspeech_m84/**'
      - 'WildSpeech_M8/notebooks/WILDSPEECH_M84_PHASE0_MASTER.ipynb'
      - 'WildSpeech_M8/tests/test_m84_*.py'
      - 'WildSpeech_M8/pyproject.toml'
      - '.github/workflows/wildspeech-m84.yml'
  pull_request:
    paths:
      - 'WildSpeech_M8/src/wildspeech_m84/**'
      - 'WildSpeech_M8/notebooks/WILDSPEECH_M84_PHASE0_MASTER.ipynb'
      - 'WildSpeech_M8/tests/test_m84_*.py'
  workflow_dispatch:

jobs:
  phase0-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact local repository package
        run: python -m pip install -e "./WildSpeech_M8[test]"
      - name: Verify all M8.4 synthetic and notebook tests
        run: python -m pytest -v WildSpeech_M8/tests/test_m84_*.py
