[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildspeech-m8"
version = "0.8.1"
description = "Fold-safe student score-aware discovery and multimodal speech experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scipy>=1.11",
  "scikit-learn>=1.3", "catboost>=1.2", "matplotlib>=3.7",
  "soundfile>=0.12", "tqdm>=4.66", "nbformat>=5.9",
  "tabulate>=0.9", "pyarrow>=14",
]

[project.optional-dependencies]
phonetic = ["torch>=2.2", "transformers>=4.44,<5", "eng-to-ipa>=0.0.2"]
test = ["pytest>=7.4"]

[project.scripts]
wildspeech-m8-audio = "wildspeech_m8.m8_audio:main"
wildspeech-m8-asr = "wildspeech_m8.m8_speech:main"
wildspeech-m8-phonetic = "wildspeech_m8.m8_phonetic:cli"
wildspeech-m8-train = "wildspeech_m8.m8_pipeline:cli"
wildspeech-m8-research = "wildspeech_m8.m8_research:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]